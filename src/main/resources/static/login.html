<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Entrar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark"><span id="brand-initial">}{</span></div>
        <div>
          <h1 id="brand-name">Sistema de Gestão</h1>
          <p id="brand-tagline">Gerencie sua emprea</p>
        </div>
      </div>

      <div class="alert alert-danger" id="login-error" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit">Entrar</button>
      </form>

      <p class="login-foot">Acesso restrito à equipe. Fale com o administrador em caso de dúvida.</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
